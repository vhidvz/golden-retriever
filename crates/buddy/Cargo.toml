[package]
name = "buddy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
buddy-core = { version = "0.1.0", path = "../buddy-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
ureq = { version = "3.5.2", features = ["json"] }
zbus = "5"
